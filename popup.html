<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AI YouTube Focus Filter</title>
  <style>
    * { box-sizing: border-box; }
    body { width: 320px; font-family: 'Segoe UI', Arial, sans-serif; padding: 15px; background: #141414; color: #fff; margin: 0; }
    h3 { margin: 0 0 12px; color: #ff4444; border-bottom: 1px solid #2d2d2d; padding-bottom: 8px; font-size: 16px; }
    label { font-size: 11px; color: #aaa; display: block; margin-bottom: 6px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
    input { width: 100%; padding: 10px; margin-bottom: 14px; border-radius: 6px; border: 1px solid #333; background: #1f1f1f; color: #fff; font-size: 13px; }
    input:focus { border-color: #ff4444; outline: none; }
    .hint { font-size: 11px; color: #888; margin-top: -8px; margin-bottom: 14px; display: block; }
    .hint a { color: #44aaff; text-decoration: none; }
    .section-title { font-size: 12px; color: #ff4444; font-weight: 700; margin: 16px 0 10px; padding-bottom: 4px; border-bottom: 1px solid #2d2d2d; }
    .buttons { display: flex; gap: 8px; }
    button { padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 13px; color: #fff; transition: background 0.2s; }
    #save-btn { flex: 2; background: #00cc66; }
    #save-btn:hover { background: #00b359; }
    #clear-btn { flex: 1; background: #333; }
    #clear-btn:hover { background: #444; }
    .status { font-size: 12px; color: #00cc66; text-align: center; margin-top: 10px; min-height: 16px; }
    .error { font-size: 12px; color: #ff6b6b; text-align: center; margin-top: 6px; min-height: 16px; word-wrap: break-word; }
  </style>
</head>
<body>
  <h3>AI YouTube Focus Filter</h3>

  <div class="section-title">Primary Provider — Groq</div>

  <label for="api-key">Groq API Key</label>
  <input type="password" id="api-key" placeholder="gsk_...">
  <span class="hint"><a href="https://console.groq.com/keys" target="_blank">Get a free Groq key</a></span>

  <div class="section-title">Fallback Provider — Cerebras</div>

  <label for="fallback-api-key">Cerebras API Key <span style="color:#666;font-weight:400;">(optional)</span></label>
  <input type="password" id="fallback-api-key" placeholder="csk_...">
  <span class="hint"><a href="https://cloud.cerebras.ai" target="_blank">Get a free Cerebras key</a> — 14,400 req/day, no card</span>

  <div class="section-title">Filter Settings</div>

  <label for="filter-topic">Focus topic</label>
  <input type="text" id="filter-topic" placeholder="e.g. Learn Python, Space Documentaries">

  <div class="buttons">
    <button id="save-btn">Apply Filter</button>
    <button id="clear-btn">Clear</button>
  </div>
  <div id="status-msg" class="status"></div>
  <div id="error-msg" class="error"></div>

  <script src="popup.js"></script>
</body>
</html>
